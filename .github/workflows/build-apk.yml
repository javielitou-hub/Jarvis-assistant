name: Build Jarvis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Project and Fix Android Native Code
        run: |
          # 1. Scaffold project
          flutter create --org com.starkindustries temp_project
          
          # 2. Copy source files
          cp pubspec.yaml temp_project/pubspec.yaml
          cp main.dart temp_project/lib/main.dart
          cp AndroidManifest.xml temp_project/android/app/src/main/AndroidManifest.xml

          # 3. Create accessibility service XML config
          mkdir -p temp_project/android/app/src/main/res/xml
          cat << 'EOF' > temp_project/android/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="100" />
          EOF

          # 4. Create the missing JarvisAccessibilityService Kotlin class
          mkdir -p temp_project/android/app/src/main/kotlin/com/starkindustries/jarvis
          cat << 'EOF' > temp_project/android/app/src/main/kotlin/com/starkindustries/jarvis/JarvisAccessibilityService.kt
          package com.starkindustries.jarvis

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent

          class JarvisAccessibilityService : AccessibilityService() {
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF

          # 5. Enforce SDK targets
          find temp_project/android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion.*/minSdkVersion = 24/g' {} +
          find temp_project/android/app -name "build.gradle*" -exec sed -i 's/minSdk = .*/minSdk = 24/g' {} +
          find temp_project/android/app -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +
          find temp_project/android/app -name "build.gradle*" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion = 36/g' {} +

      - name: Get Dependencies
        working-directory: temp_project
        run: |
          flutter pub get
          # Strip deprecated jcenter from cached Gradle configs if present
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} + 2>/dev/null || true

      - name: Build Release APK
        working-directory: temp_project
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
